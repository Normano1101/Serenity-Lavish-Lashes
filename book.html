<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lashes</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
        }

        /* NAVBAR */
        nav {
            background: #000;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url("");
            background-size: cover;
            color: white;
        }

        .hero h1 {
            font-size: 40px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: hotpink;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        /* SERVICES */
        .services {
            padding: 50px 20px;
            text-align: center;
        }

        .service-box {
            display: inline-block;
            width: 250px;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        /* FOOTER */
        footer {
            background: #000;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Book</a>
        <a href="#">Contact</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Luxury Lash Extensions</h1>
    <p>Wake up beautiful every day ✨</p>

    <h2>Ready to Book?</h2>
    <a href="#" class="btn">Book Now</a>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 Luxe Lashes | Follow med on Instagram</p>
</footer>

</body>
</html>
